[package]
name = "librqbit"
version = "9.0.0-beta.2"
authors = ["Igor Katson <igor.katson@gmail.com>"]
edition = "2024"
description = "The main library used by rqbit torrent client. The binary is just a small wrapper on top of it."
license = "Apache-2.0"
documentation = "https://docs.rs/librqbit"
repository = "https://github.com/ikatson/rqbit"
readme = "README.md"
build = "build.rs"

[features]
default = ["default-tls", "http-api-client"]
tokio-console = ["console-subscriber", "tokio/tracing"]
http-api = ["axum", "tower-http"]
http-api-client = []
upnp-serve-adapter = ["upnp-serve"]
webui = []
timed_existence = []
default-tls = ["reqwest/default-tls", "sha1w/sha1-crypto-hash", "librqbit-core/sha1-crypto-hash", "orc-mse/sha1-crypto-hash"]
miri = []
prometheus = ["metrics-exporter-prometheus"]
rust-tls = ["reqwest/rustls-tls", "sha1w/sha1-ring", "librqbit-core/sha1-ring", "orc-mse/sha1-ring"]
storage_middleware = ["lru"]
storage_examples = []
tracing-subscriber-utils = ["tracing-subscriber"]
postgres = ["sqlx", "home"]
async-bt = ["async-backtrace"]
watch = ["notify"]
disable-upload = []
_disable_disk_write_net_benchmark = []
_disable_reconnect_test = []

[dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio", "macros", "postgres"], optional = true, default-features = false }
home = { version = "0.5", optional = true }
bencode = { path = "../rqbit-v9/bencode", package = "librqbit-bencode", default-features = false }
tracker_comms = { path = "../rqbit-v9/tracker_comms", package = "librqbit-tracker-comms", default-features = false }
buffers = { path = "../rqbit-v9/buffers", package = "librqbit-buffers" }
librqbit-core = { path = "../rqbit-v9/librqbit_core", default-features = false }
librqbit-lsd = { path = "../rqbit-v9/librqbit_lsd", default-features = false }
clone_to_owned = { path = "../rqbit-v9/clone_to_owned", package = "librqbit-clone-to-owned" }
peer_binary_protocol = { path = "../rqbit-v9/peer_binary_protocol", package = "librqbit-peer-protocol", default-features = false }
sha1w = { path = "../rqbit-v9/sha1w", package = "librqbit-sha1-wrapper", default-features = false }
dht = { path = "../rqbit-v9/dht", package = "librqbit-dht", default-features = false }
librqbit-upnp = { path = "../rqbit-v9/upnp" }
upnp-serve = { path = "../rqbit-v9/upnp-serve", package = "librqbit-upnp-serve", default-features = false, optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util"] }
governor = "0.10"
console-subscriber = { version = "0.5", optional = true }
axum = { version = "0.8", optional = true }
tower-http = { version = "0.6", features = ["cors", "trace"], optional = true }
tokio-stream = "0.1"
serde = { version = "1", features = ["rc"] }
serde_derive = "1"
serde_json = "1"
serde_urlencoded = "0.7"
anyhow = "1"
itertools = "0.14"
http = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "socks", "stream"] }
urlencoding = "2"
byteorder = "1"
bincode = "2"
bitvec = "1"
parking_lot = "0.12"
tracing = "0.1"
size_format = "1"
rand = "0.9"
tracing-subscriber = { version = "0.3", default-features = false, features = ["json", "fmt", "env-filter"], optional = true }
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
url = { version = "2", default-features = false, features = ["serde"] }
hex = "0.4"
backon = "1.5"
dashmap = "6"
base64 = "0.22"
serde_with = "3"
tokio-util = { version = "0.7", features = ["io"] }
metrics-exporter-prometheus = { version = "0.17", default-features = false, optional = true }
bytes = "1"
rlimit = "0.10"
async-stream = "0.3"
memmap2 = "0.9"
lru = { version = "0.16", optional = true }
mime_guess = { version = "2", default-features = false }
tokio-socks = "0.5"
async-trait = "0.1"
async-backtrace = { version = "0.2", optional = true }
notify = { version = "8", optional = true }
walkdir = "2"
arc-swap = "1.7"
intervaltree = "0.2"
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
librqbit-utp = { version = "0.6", features = ["export-metrics"] }
axum-extra = { version = "0.10", features = ["query"] }
librqbit-dualstack-sockets = { version = "0.6", features = ["axum"] }
socket2 = "0.6"
nix = { version = "0.30", features = ["uio"] }
thiserror = "2"
orc-mse = { path = "../orc-mse", default-features = false }
orc-scheduler = { path = "../orc-scheduler" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32", "Win32_System", "Win32_System_IO", "Win32_System_Ioctl"] }

[build-dependencies]
anyhow = "1"

[dev-dependencies]
tracing-subscriber = "0.3"
tokio-test = "0.4"
tempfile = "3"
pollster = "0.4"

[[example]]
name = "simulate_traffic"
required-features = ["http-api", "webui", "tracing-subscriber-utils", "prometheus"]

[package]
name = "orc-daemon"
version = "2.5.0"
edition.workspace = true
license.workspace = true

authors = ["ORC Torrent / The ANIMUS PROJECT"]

[features]
default = ["with-native-tls", "desktop-search", "desktop-watch-folders"]
with-native-tls = ["orc-engine/native-tls", "orc-core/native-tls", "reqwest/native-tls", "reqwest/macos-system-configuration"]
tls-rustls = ["orc-engine/rust-tls", "orc-core/tls-rustls", "reqwest/rustls-tls"]
desktop-search = []
desktop-watch-folders = []

[dependencies]
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
uuid.workspace = true
base64.workspace = true
async-trait.workspace = true
reqwest.workspace = true
url.workspace = true
quick-xml.workspace = true
regex.workspace = true
orc-engine = { workspace = true, default-features = false }
orc-core = { path = "../orc-core", default-features = false }
subtle.workspace = true
tower.workspace = true
aes-gcm.workspace = true
rand.workspace = true
futures.workspace = true

[target.'cfg(not(target_os = "android"))'.dependencies]
keyring.workspace = true
notify = "8.0"

[dev-dependencies]
tempfile = "3.14"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
wiremock = "0.6"

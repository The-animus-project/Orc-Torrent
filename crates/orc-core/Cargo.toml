[package]
name = "orc-core"
version = "2.3.4"
edition.workspace = true
license.workspace = true

authors = ["ORC Torrent / The ANIMUS PROJECT"]

[features]
default = ["native-tls"]
# Native stack TLS (platform Schannel / Security.framework / OpenSSL as provided by reqwest).
native-tls = ["librqbit/default-tls"]
# Rustls for librqbit — useful for some cross-compiles; build daemon with:
#   cargo build -p orc-daemon --no-default-features --features tls-rustls
# Do not combine with native-tls.
tls-rustls = ["librqbit/rust-tls"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
anyhow.workspace = true
base64.workspace = true
tracing.workspace = true
sha1 = "0.10"
hex = "0.4"
regex = "1.10"

# Embedded BitTorrent runtime (TLS via workspace feature flags).
librqbit = { workspace = true, default-features = false, features = ["http-api-client"] }

# We already use tokio in the daemon; core now uses it for time sampling.
tokio.workspace = true

# Network interface detection for VPN monitoring
network-interface = "1.0"

# GeoIP lookup for peer country detection
maxminddb = "0.27"
url.workspace = true
chrono = { version = "0.4", features = ["serde"] }

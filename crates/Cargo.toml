[workspace]
resolver = "2"
members = [
  "orc-engine",
  "orc-mse",
  "orc-scheduler",
  "orc-core",
  "orc-daemon",
  "orc-android",
  "librqbit-v9-patched",
  "rqbit-v9/*",
]

[workspace.package]
edition = "2021"
license = "AGPL-3.0"

[workspace.dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "signal", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "timeout", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
base64 = "0.22"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "charset", "http2", "stream"] }
url = "2.5"
quick-xml = "0.41"
regex = "1.11"

# Internal crates from the tagged rqbit v9.0.0-beta.2 source tree.
bencode = { path = "rqbit-v9/bencode", package = "librqbit-bencode", default-features = false }
buffers = { path = "rqbit-v9/buffers", package = "librqbit-buffers" }
clone_to_owned = { path = "rqbit-v9/clone_to_owned", package = "librqbit-clone-to-owned" }
librqbit-core = { path = "rqbit-v9/librqbit_core", default-features = false }
librqbit-lsd = { path = "rqbit-v9/librqbit_lsd", default-features = false }
peer_binary_protocol = { path = "rqbit-v9/peer_binary_protocol", package = "librqbit-peer-protocol", default-features = false }
sha1w = { path = "rqbit-v9/sha1w", package = "librqbit-sha1-wrapper", default-features = false }
dht = { path = "rqbit-v9/dht", package = "librqbit-dht", default-features = false }
tracker_comms = { path = "rqbit-v9/tracker_comms", package = "librqbit-tracker-comms", default-features = false }
librqbit-upnp = { path = "rqbit-v9/upnp" }
upnp-serve = { path = "rqbit-v9/upnp-serve", package = "librqbit-upnp-serve", default-features = false }

# Shared dependencies required by the tagged backend crates.
arrayvec = "0.7"
assert_cfg = "0.1"
async-stream = "0.3"
atoi = "2"
aws-lc-rs = "1.12"
backon = "1.5"
bitvec = "1"
bstr = "1"
byteorder = "1"
bytes = "1"
chardetng = "0.1"
chrono = "0.4"
criterion = "0.7"
crypto-hash = "0.3"
data-encoding = "2"
dashmap = "6"
directories = "6"
encoding_rs = "0.8"
futures = "0.3"
gethostname = "1"
hex = "0.4"
httparse = "1"
http = "1"
indexmap = "2"
itertools = "0.14"
leaky-bucket = "1.1"
librqbit-dualstack-sockets = "0.6"
memchr = "2"
mime_guess = { version = "2", default-features = false }
network-interface = "2"
parking_lot = "0.12"
serde_derive = "1"
serde_with = "3"
socket2 = "0.6"
thiserror = "2"
tokio-stream = "0.1"
tokio-util = "0.7"
urlencoding = "2"
walkdir = "2"

# Embedded BitTorrent runtime (default features off; orc-core / orc-daemon pick TLS via features).
librqbit = { version = "9.0.0-beta.2", default-features = false }
orc-engine = { path = "orc-engine", default-features = false }
orc-scheduler = { path = "orc-scheduler" }

# Security dependencies
subtle = "2.5"
tower = { version = "0.5", features = ["limit", "util"] }
keyring = "3.6"
aes-gcm = "0.10"
rand = "0.8"
num-bigint = "0.4"
rc4 = { version = "0.1", features = ["zeroize"] }
zeroize = "1.8"

[patch.crates-io]
# Tagged rqbit v9.0.0-beta.2 with ORC's embedded-runtime and storage patches.
librqbit = { path = "librqbit-v9-patched" }

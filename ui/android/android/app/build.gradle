import groovy.json.JsonSlurper

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def androidPackage = new JsonSlurper().parse(file('../../package.json'))
def androidVersion = androidPackage.version as String
def semanticVersion = androidVersion =~ /^(\d+)\.(\d+)\.(\d+)/
if (!semanticVersion.find()) {
    throw new GradleException("Android package version must use major.minor.patch: ${androidVersion}")
}
def androidVersionCode =
        (semanticVersion.group(1) as int) * 1_000_000 +
        (semanticVersion.group(2) as int) * 1_000 +
        (semanticVersion.group(3) as int)

android {
    namespace = "com.orc.torrent"
    compileSdk = rootProject.ext.compileSdkVersion
    ndkVersion = '28.2.13676358'
    defaultConfig {
        applicationId "com.orc.torrent"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode androidVersionCode
        versionName androidVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'x86_64'
            universalApk false
        }
    }
    signingConfigs {
        release {
            def keystorePath = System.getenv('ORC_ANDROID_KEYSTORE_PATH')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('ORC_ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ORC_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ORC_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv('ORC_ANDROID_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.documentfile:documentfile:1.1.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

def repoRoot = file('../../../..')
tasks.register('buildRustAndroid', Exec) {
    workingDir new File(repoRoot, 'crates')
    commandLine 'cargo', 'ndk', '-t', 'arm64-v8a', '-t', 'x86_64', '-o',
            new File(projectDir, 'src/main/jniLibs').absolutePath,
            'build', '-p', 'orc-android', '--release'
    onlyIf { System.getenv('ORC_SKIP_RUST_ANDROID') != '1' }
}
preBuild.dependsOn tasks.named('buildRustAndroid')

android.applicationVariants.all { variant ->
    variant.outputs.all { output ->
        def abi = output.getFilter(com.android.build.OutputFile.ABI)
        if (variant.buildType.name == 'release' && abi) {
            outputFileName = "ORC-TORRENT-${variant.versionName}-android-${abi}.apk"
        }
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ORC TORRENT</title>
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const edition = params.get("edition") === "animus" ? "animus" : "standard";
        const initialTheme = params.get("theme") === "light" ? "light" : "dark";
        function applyTheme(theme) {
          const nextTheme = edition === "animus" ? "dark" : theme === "light" ? "light" : "dark";
          document.documentElement.dataset.appEdition = edition;
          document.documentElement.dataset.appTheme = nextTheme;
          document.documentElement.style.colorScheme = nextTheme;
          if (document.body) {
            document.body.dataset.edition = edition;
            document.body.dataset.appTheme = nextTheme;
          }
        }
        window.__applyOrcTheme = function (state) {
          applyTheme(state && state.resolved === "light" ? "light" : "dark");
        };
        applyTheme(initialTheme);
      })();
    </script>

    <style>
      :root {
        --bg: #0f1115;
        --fg: #fff;
        --dim: rgba(255, 255, 255, 0.72);
        --mute: rgba(255, 255, 255, 0.46);
        --hair: rgba(255, 255, 255, 0.1);
        --hair2: rgba(255, 255, 255, 0.06);
        --meta-strong: rgba(255, 255, 255, 0.88);
        --splash-backdrop:
          radial-gradient(1100px 720px at 50% 36%, rgba(255, 255, 255, 0.07) 0%, transparent 55%),
          radial-gradient(900px 600px at 50% 82%, rgba(255, 255, 255, 0.03) 0%, transparent 60%),
          radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(0, 0, 0, 0.78) 80%, rgba(0, 0, 0, 0.95) 100%), #000;
        --splash-halo: radial-gradient(circle, rgba(255, 255, 255, 0.12), transparent 62%);
        --splash-orc-shadow: drop-shadow(0 26px 120px rgba(0, 0, 0, 0.92))
          drop-shadow(0 0 70px rgba(255, 255, 255, 0.12));

        --easeOut: cubic-bezier(0.16, 1, 0.3, 1);
        --easeInOut: cubic-bezier(0.4, 0, 0.2, 1);
      }

      html[data-app-theme="light"] {
        --bg: #f8f3ea;
        --fg: #1b1a17;
        --dim: rgba(27, 26, 23, 0.72);
        --mute: rgba(27, 26, 23, 0.5);
        --hair: rgba(27, 26, 23, 0.12);
        --hair2: rgba(27, 26, 23, 0.06);
        --meta-strong: rgba(27, 26, 23, 0.86);
        --splash-backdrop:
          radial-gradient(1100px 720px at 50% 32%, rgba(255, 255, 255, 0.75) 0%, transparent 58%),
          radial-gradient(900px 600px at 50% 82%, rgba(255, 255, 255, 0.38) 0%, transparent 60%),
          radial-gradient(
            120% 90% at 50% 45%,
            transparent 52%,
            rgba(232, 223, 209, 0.58) 82%,
            rgba(241, 234, 223, 0.95) 100%
          ),
          linear-gradient(180deg, #f8f3ea 0%, #f1eadf 100%);
        --splash-halo: radial-gradient(circle, rgba(255, 255, 255, 0.72), transparent 62%);
        --splash-orc-shadow: drop-shadow(0 26px 90px rgba(82, 63, 39, 0.22))
          drop-shadow(0 0 50px rgba(255, 255, 255, 0.4));
      }

      body[data-edition="animus"] {
        --bg: #000000;
        --fg: #ffffff;
        --dim: rgba(255, 255, 255, 0.88);
        --mute: rgba(255, 255, 255, 0.72);
        --hair: rgba(157, 255, 0, 0.24);
        --hair2: rgba(255, 255, 255, 0.08);
        --meta-strong: #9dff00;
        --animus-lime: #9dff00;
        --animus-lime-deep: #6fc400;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      body {
        overflow: hidden;
      }

      .bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        background: var(--splash-backdrop);
        animation: bgBreath 6.5s var(--easeInOut) infinite;
      }
      @keyframes bgBreath {
        0%,
        100% {
          filter: brightness(1);
        }
        50% {
          filter: brightness(1.03);
        }
      }

      body[data-edition="animus"] .bg {
        animation: none;
        background: #000000;
      }

      body[data-edition="animus"] .bg::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 120% 80% at 50% 38%, rgba(34, 34, 34, 0.55) 0%, transparent 62%),
          radial-gradient(circle at 18% 22%, rgba(48, 48, 48, 0.35) 0%, transparent 18%),
          radial-gradient(circle at 78% 28%, rgba(40, 40, 40, 0.28) 0%, transparent 16%),
          radial-gradient(circle at 62% 72%, rgba(36, 36, 36, 0.32) 0%, transparent 20%),
          radial-gradient(circle at 24% 68%, rgba(44, 44, 44, 0.24) 0%, transparent 14%);
        opacity: 0.9;
      }

      body[data-edition="animus"] .bg::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image: var(--edition-splash-grunge, none);
        background-position: center;
        background-size: cover;
        opacity: 0.22;
        filter: grayscale(1) brightness(0.42) contrast(1.2);
        mix-blend-mode: screen;
        pointer-events: none;
      }

      .animus-drips {
        display: none;
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      body[data-edition="animus"] .animus-drips {
        display: block;
      }

      .animus-drip {
        position: absolute;
        top: 0;
        width: var(--drip-width, 7px);
        height: var(--drip-length, 120px);
        transform-origin: top center;
        opacity: 0;
        border-radius: 0 0 999px 999px / 0 0 100% 100%;
        background: linear-gradient(
          180deg,
          rgba(157, 255, 0, 0.95) 0%,
          rgba(127, 214, 0, 0.88) 55%,
          rgba(90, 168, 0, 0.72) 100%
        );
        box-shadow:
          0 0 10px rgba(157, 255, 0, 0.28),
          inset -1px 0 0 rgba(255, 255, 255, 0.12);
        animation: animusPaintDrip var(--drip-duration, 4.8s) var(--easeInOut) infinite;
        animation-delay: var(--drip-delay, 0s);
      }

      .animus-drip::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -5px;
        width: calc(var(--drip-width, 7px) * 1.35);
        height: calc(var(--drip-width, 7px) * 1.35);
        transform: translateX(-50%);
        border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
        background: radial-gradient(circle at 40% 35%, #d7ff83 0%, #9dff00 45%, #6fc400 100%);
        opacity: 0;
        animation: animusDripBulb var(--drip-duration, 4.8s) var(--easeInOut) infinite;
        animation-delay: var(--drip-delay, 0s);
      }

      .animus-drip.is-muted {
        background: linear-gradient(
          180deg,
          rgba(210, 210, 210, 0.55) 0%,
          rgba(140, 140, 140, 0.42) 55%,
          rgba(90, 90, 90, 0.28) 100%
        );
        box-shadow: 0 0 6px rgba(255, 255, 255, 0.08);
      }

      .animus-drip.is-muted::after {
        background: radial-gradient(circle at 40% 35%, #f0f0f0 0%, #bdbdbd 55%, #7a7a7a 100%);
      }

      .animus-splat {
        position: absolute;
        width: var(--splat-size, 18px);
        height: var(--splat-size, 18px);
        border-radius: 42% 58% 52% 48% / 48% 42% 58% 52%;
        background: radial-gradient(circle at 35% 30%, rgba(215, 255, 131, 0.7) 0%, rgba(157, 255, 0, 0.35) 55%, transparent 100%);
        opacity: 0;
        transform: scale(0.4);
        animation: animusPaintSplat var(--splat-duration, 5.6s) var(--easeOut) infinite;
        animation-delay: var(--splat-delay, 0s);
      }

      .animus-splat.is-muted {
        background: radial-gradient(circle at 35% 30%, rgba(230, 230, 230, 0.45) 0%, rgba(160, 160, 160, 0.22) 55%, transparent 100%);
      }

      .animus-drip-1 {
        --drip-width: 6px;
        --drip-length: 96px;
        --drip-duration: 5.2s;
        --drip-delay: 0s;
        left: 11%;
      }

      .animus-drip-2 {
        --drip-width: 9px;
        --drip-length: 148px;
        --drip-duration: 6.4s;
        --drip-delay: 1.1s;
        left: 24%;
      }

      .animus-drip-3 {
        --drip-width: 5px;
        --drip-length: 72px;
        --drip-duration: 4.6s;
        --drip-delay: 2.4s;
        left: 38%;
      }

      .animus-drip-4 {
        --drip-width: 8px;
        --drip-length: 132px;
        --drip-duration: 5.8s;
        --drip-delay: 0.7s;
        left: 56%;
      }

      .animus-drip-5 {
        --drip-width: 7px;
        --drip-length: 110px;
        --drip-duration: 6.8s;
        --drip-delay: 1.8s;
        left: 71%;
      }

      .animus-drip-6 {
        --drip-width: 10px;
        --drip-length: 164px;
        --drip-duration: 7.2s;
        --drip-delay: 3.1s;
        left: 84%;
      }

      .animus-drip-7 {
        --drip-width: 4px;
        --drip-length: 58px;
        --drip-duration: 4.2s;
        --drip-delay: 2.9s;
        left: 47%;
      }

      .animus-drip-8 {
        --drip-width: 6px;
        --drip-length: 88px;

        --drip-delay: 4.2s;

      }

      .animus-splat-1 {
        --splat-size: 22px;
        --splat-duration: 6.2s;
        --splat-delay: 1.4s;
        left: 10%;
        top: 28%;
      }

      .animus-splat-2 {
        --splat-size: 16px;
        --splat-duration: 5.4s;
        --splat-delay: 2.8s;
        left: 78%;
        top: 22%;
      }

      .animus-splat-3 {
        --splat-size: 14px;
        --splat-duration: 4.8s;
        --splat-delay: 0.5s;
        left: 32%;
        top: 18%;
      }

      .animus-splat-4 {
        --splat-size: 20px;
        --splat-duration: 6.8s;
        --splat-delay: 3.6s;
        left: 88%;
        top: 34%;
      }

      @keyframes animusPaintDrip {
        0% {
          opacity: 0;
          transform: scaleY(0.08);
        }
        14% {
          opacity: var(--drip-peak-opacity, 0.72);
          transform: scaleY(0.35);
        }
        42% {
          opacity: var(--drip-peak-opacity, 0.82);
          transform: scaleY(1);
        }
        68% {
          opacity: 0.62;
          transform: scaleY(1.06) translateY(6px);
        }
        100% {
          opacity: 0;
          transform: scaleY(1.18) translateY(22px);
        }
      }

      @keyframes animusDripBulb {
        0%,
        30% {
          opacity: 0;
          transform: translateX(-50%) scale(0.4);
        }
        48% {
          opacity: 0.9;
          transform: translateX(-50%) scale(1);
        }
        72% {
          opacity: 0.7;
          transform: translateX(-50%) scale(1.08) translateY(3px);
        }
        100% {
          opacity: 0;
          transform: translateX(-50%) scale(0.7) translateY(14px);
        }
      }

      @keyframes animusPaintSplat {
        0%,
        18% {
          opacity: 0;
          transform: scale(0.35) rotate(0deg);
        }
        34% {
          opacity: 0.55;
          transform: scale(1) rotate(8deg);
        }
        58% {
          opacity: 0.38;
          transform: scale(1.12) rotate(-4deg);
        }
        100% {
          opacity: 0;
          transform: scale(0.85) rotate(6deg);
        }
      }

      .wrap {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        padding: clamp(18px, 3vw, 40px);
      }

      .stack {
        width: min(980px, 92vw);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(18px, 2.4vw, 26px);
        opacity: 0;
        transform: translateY(10px);
        animation: in 900ms var(--easeOut) forwards;
      }
      @keyframes in {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .stack-animus {
        width: 100%;
        height: 100%;
        max-width: none;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        gap: 0;
        padding: clamp(28px, 7vh, 52px) clamp(20px, 5vw, 36px) clamp(22px, 5vh, 40px);
      }

      body[data-edition="animus"] .stack-standard {
        display: none;
      }

      body[data-edition="animus"] .stack-animus {
        display: flex;
      }

      body[data-edition="animus"] .wrap {
        padding: 0;
      }

      .hero {
        position: relative;
        width: min(72vh, 92vw);
        max-width: 860px;
        display: grid;
        place-items: center;
      }

      .hero::before {
        content: "";
        position: absolute;
        width: 90%;
        aspect-ratio: 1 / 1;
        border-radius: 999px;
        background: var(--splash-halo);
        filter: blur(80px);
        opacity: 0.65;
        animation: halo 4.8s var(--easeInOut) infinite;
      }
      @keyframes halo {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.52;
        }
        50% {
          transform: scale(1.08);
          opacity: 0.82;
        }
      }

      .orc {
        position: relative;
        width: 100%;
        height: auto;
        object-fit: contain;
        image-rendering: auto;
        filter: var(--splash-orc-shadow);
        opacity: 0;
        transform: scale(0.97);
        animation:
          orcIn 1100ms var(--easeOut) 120ms forwards,
          float 6s var(--easeInOut) 1500ms infinite;
      }
      @keyframes orcIn {
        0% {
          opacity: 0;
          transform: scale(0.92) translateY(-10px);
          filter: blur(10px);
        }
        70% {
          transform: scale(1.01) translateY(0);
        }
        100% {
          opacity: 1;
          transform: scale(0.985) translateY(0);
          filter: blur(0);
        }
      }
      @keyframes float {
        0%,
        100% {
          transform: scale(0.985) translateY(0);
        }
        50% {
          transform: scale(1) translateY(-6px);
        }
      }

      .brand {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }

      .title {
        font-size: clamp(40px, 4.6vw, 64px);
        font-weight: 900;
        letter-spacing: clamp(3px, 0.45vw, 8px);
        text-transform: uppercase;
        line-height: 1.02;
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
      }
      .title-orc {
        color: #22c55e;
      }

      .sub {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 6px;
        text-transform: uppercase;
        color: var(--dim);
      }

      .meta {
        margin-top: 2px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2.2px;
        text-transform: uppercase;
        color: var(--mute);
      }
      .meta strong {
        color: var(--meta-strong);
        font-weight: 850;
      }

      .loader {
        width: min(520px, 86vw);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        margin-top: 2px;
      }

      .pieces {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
        opacity: 0.92;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--hair2);
        border: 1px solid var(--hair);
      }
      .dot.on {
        background: var(--dim);
        border-color: var(--hair);
      }

      .bar {
        width: 100%;
        height: 2px;
        border-radius: 999px;
        background: var(--hair);
        overflow: hidden;
        position: relative;
      }

      .fill {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: var(--meta-strong);
        box-shadow: 0 0 18px var(--hair);
        transition: width 260ms var(--easeOut);
      }

      .status {
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--mute);
      }

      .animus-brand-zone {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 0;
        padding-top: clamp(8px, 2vh, 18px);
      }

      .animus-logo {
        width: min(400px, 90vw);
        max-height: min(58vh, 520px);
        object-fit: contain;
        opacity: 0;
        transform: scale(0.96) translateY(12px);
        filter: drop-shadow(0 0 36px rgba(157, 255, 0, 0.14));
        animation: animusLogoIn 1.15s var(--easeOut) 120ms forwards;
      }

      @keyframes animusLogoIn {
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      .animus-loader-zone {
        width: min(420px, 88vw);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        flex-shrink: 0;
      }

      body[data-edition="animus"] .animus-loader-zone .loader {
        width: 100%;
        gap: 14px;
        margin-top: 0;
      }

      body[data-edition="animus"] .animus-loader-zone .pieces {
        display: none;
      }

      body[data-edition="animus"] .animus-loader-zone .bar {
        height: 10px;
        border: 1px solid rgba(157, 255, 0, 0.22);
        background: rgba(255, 255, 255, 0.08);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03);
        animation: animusTrackPulse 2.4s var(--easeInOut) infinite;
      }

      body[data-edition="animus"] .animus-loader-zone .fill {
        position: relative;
        overflow: hidden;
        background: linear-gradient(90deg, var(--animus-lime) 0%, var(--animus-lime-deep) 72%, #b8ff4a 100%);
        box-shadow: 0 0 24px rgba(157, 255, 0, 0.42);
        transition: width 120ms linear;
      }

      body[data-edition="animus"] .animus-loader-zone .fill::before {
        content: "";
        position: absolute;
        top: 50%;
        right: 0;
        width: 10px;
        height: 14px;
        transform: translate(45%, -50%);
        border-radius: 999px;
        background: #e8ffb8;
        box-shadow:
          0 0 10px rgba(215, 255, 131, 0.95),
          0 0 22px rgba(157, 255, 0, 0.65);
        animation: animusBarHeadPulse 0.85s var(--easeInOut) infinite;
      }

      body[data-edition="animus"] .animus-loader-zone .fill::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          105deg,
          transparent 0%,
          transparent 38%,
          rgba(255, 255, 255, 0.42) 50%,
          transparent 62%,
          transparent 100%
        );
        transform: translateX(-120%);
        animation: animusBarShine 1.35s ease-in-out infinite;
      }

      @keyframes animusTrackPulse {
        0%,
        100% {
          border-color: rgba(157, 255, 0, 0.18);
        }
        50% {
          border-color: rgba(157, 255, 0, 0.34);
        }
      }

      @keyframes animusBarShine {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(220%);
        }
      }

      @keyframes animusBarHeadPulse {
        0%,
        100% {
          opacity: 0.72;
          transform: translate(45%, -50%) scale(0.88);
        }
        50% {
          opacity: 1;
          transform: translate(45%, -50%) scale(1.12);
        }
      }

      body[data-edition="animus"] .animus-loader-zone .status {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.24em;
        color: #ffffff;
      }

      .animus-emblem {
        width: 34px;
        height: 40px;
        opacity: 0;
        transform: translateY(8px);
        animation: animusEmblemIn 900ms var(--easeOut) 520ms forwards;
      }

      .animus-emblem img,
      .animus-emblem svg {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      @keyframes animusEmblemIn {
        to {
          opacity: 0.92;
          transform: translateY(0);
        }
      }

      body.splash-exit .stack {
        animation: out 900ms var(--easeInOut) forwards;
      }
      @keyframes out {
        to {
          opacity: 0;
          transform: scale(0.99);
          filter: blur(10px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
        .stack,
        .animus-logo,
        .animus-emblem {
          opacity: 1 !important;
          transform: none !important;
        }
        .orc {
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </head>

  <body>
    <div class="bg">
      <div class="animus-drips" aria-hidden="true">
        <span class="animus-drip animus-drip-1"></span>
        <span class="animus-drip animus-drip-2"></span>
        <span class="animus-drip animus-drip-3 is-muted"></span>
        <span class="animus-drip animus-drip-4"></span>
        <span class="animus-drip animus-drip-5"></span>
        <span class="animus-drip animus-drip-6"></span>
        <span class="animus-drip animus-drip-7 is-muted"></span>
        <span class="animus-drip animus-drip-8"></span>
        <span class="animus-splat animus-splat-1"></span>
        <span class="animus-splat animus-splat-2"></span>
        <span class="animus-splat animus-splat-3 is-muted"></span>
        <span class="animus-splat animus-splat-4"></span>
      </div>
    </div>

    <div class="wrap">
      <div class="stack stack-standard" role="status" aria-live="polite" aria-label="ORC Torrent splash">
        <div class="hero">
          <img class="orc" id="orcLogo" src="./images/orctorrent-logo.png" alt="ORC Torrent logo" />
        </div>

        <div class="brand">
          <div class="title" id="brandTitle"><span class="title-orc">ORC</span> TORRENT</div>
          <div class="sub" id="brandSub">APEX DOWNLOADER</div>
          <div class="meta" id="brandMeta"><strong>OPEN SOURCE</strong> + <strong>THE APEX DOWNLOADER</strong></div>
        </div>

        <div class="loader">
          <div class="pieces" id="pieces" aria-label="Piece indicator"></div>
          <div class="bar" aria-label="Loading progress"><div class="fill" id="fill"></div></div>
          <div class="status" id="statusText">initializing…</div>
        </div>
      </div>

      <div class="stack stack-animus" role="status" aria-live="polite" aria-label="ORC Torrent AnimUS Edition splash">
        <div class="animus-brand-zone">
          <img
            class="animus-logo"
            id="animusLogo"
            src="./images/animus/loading-logo.png"
            alt="ORC Torrent AnimUS Edition"
          />
        </div>

        <div class="animus-loader-zone">
          <div class="loader">
            <div class="bar" aria-label="Loading progress"><div class="fill" id="animusFill"></div></div>
            <div class="status" id="animusStatusText">CONNECTING TO THE SWARM...</div>
          </div>

          <div class="animus-emblem" id="animusEmblem" aria-hidden="true">
            <svg viewBox="0 0 48 56" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M24 2L46 52H2L24 2Z" stroke="#9dff00" stroke-width="2.2" stroke-linejoin="round" />
              <path
                d="M24 14c-4.8 0-8.6 3.2-9.8 7.6 2.4 1.2 5.2 1.9 8.2 1.9s5.8-.7 8.2-1.9C32.6 17.2 28.8 14 24 14Z"
                fill="#9dff00"
              />
              <path
                d="M16.5 34.5c2.2 3.4 5.8 5.6 9.8 5.6h-4.8c-3.2 0-6-1.6-7.8-4.1l2.8-1.5Z"
                fill="#9dff00"
              />
              <path
                d="M31.5 34.5c-2.2 3.4-5.8 5.6-9.8 5.6h4.8c3.2 0 6-1.6 7.8-4.1l-2.8-1.5Z"
                fill="#9dff00"
              />
            </svg>
          </div>
        </div>
      </div>
    </div>

    <script>
      const splashParams = new URLSearchParams(window.location.search);
      const splashEdition = splashParams.get("edition") === "animus" ? "animus" : "standard";
      const splashBackground = splashParams.get("splashBackground") || "";
      const splashLogo = splashParams.get("splashLogo") || "";
      const splashEmblem = splashParams.get("splashEmblem") || "";

      if (document.body) {
        document.body.dataset.edition = splashEdition;
      }
      if (splashBackground) {
        document.documentElement.style.setProperty("--edition-splash-grunge", `url("${splashBackground}")`);
      }

      const fill = document.getElementById("fill");
      const animusFill = document.getElementById("animusFill");
      const piecesWrap = document.getElementById("pieces");
      const statusText = document.getElementById("statusText");
      const animusStatusText = document.getElementById("animusStatusText");
      const orcLogo = document.getElementById("orcLogo");
      const animusLogo = document.getElementById("animusLogo");
      const animusEmblem = document.getElementById("animusEmblem");

      const activeFill = splashEdition === "animus" ? animusFill : fill;
      const activeStatus = splashEdition === "animus" ? animusStatusText : statusText;

      const DOTS = 12;
      const dots = [];
      if (piecesWrap) {
        for (let i = 0; i < DOTS; i++) {
          const d = document.createElement("div");
          d.className = "dot";
          piecesWrap.appendChild(d);
          dots.push(d);
        }
      }

      const SPLASH_MIN_MS = 14000;
      const START_DELAY_MS = 650;

      if (splashEdition === "animus") {
        if (animusLogo && splashLogo) {
          animusLogo.setAttribute("src", splashLogo);
        }
        if (animusEmblem && splashEmblem) {
          animusEmblem.innerHTML = `<img src="${splashEmblem}" alt="" />`;
        }
      }

      const stages =
        splashEdition === "animus"
          ? [
              { at: 0.08, text: "INITIALIZING DAEMON..." },
              { at: 0.28, text: "LOADING SWARM MAPS..." },
              { at: 0.52, text: "CONNECTING TO THE SWARM..." },
              { at: 0.76, text: "LOCKING PROTECTION..." },
              { at: 1.0, text: "READY." },
            ]
          : [
              { at: 0.1, text: "initializing…" },
              { at: 0.34, text: "verifying metadata…" },
              { at: 0.62, text: "bootstrapping swarm…" },
              { at: 0.84, text: "finalizing…" },
              { at: 1.0, text: "ready." },
            ];

      let progress = 0;
      let stageIdx = 0;
      let startedAt = performance.now();
      let rafId = 0;

      const clamp = (n, a, b) => Math.max(a, Math.min(b, n));

      function setProgress(p) {
        const next = clamp(p, 0, 100);
        progress = next;
        if (activeFill) {
          activeFill.style.width = next + "%";
        }

        const on = Math.floor((next / 100) * DOTS);
        for (let i = 0; i < dots.length; i++) {
          dots[i].classList.toggle("on", i < on);
        }
      }

      function curve(x) {
        if (x < 0.6) return (x / 0.6) * 0.78;
        return 0.78 + ((x - 0.6) / 0.4) * 0.22;
      }

      function setStage(t) {
        while (stageIdx < stages.length - 1 && t >= stages[stageIdx + 1].at) stageIdx++;
        if (activeStatus) {
          activeStatus.textContent = stages[stageIdx].text;
        }
      }

      function tick(now) {
        const elapsed = now - startedAt;
        const t = clamp(elapsed / SPLASH_MIN_MS, 0, 1);
        const target = curve(t) * 100;
        const delta = target - progress;

        if (Math.abs(delta) > 0.05) {
          const step = splashEdition === "animus" ? delta * 0.12 : delta > 6 ? 2 : 1;
          setProgress(progress + step);
        } else {
          setProgress(target);
        }

        setStage(t);

        if (progress >= 99.9 && elapsed >= SPLASH_MIN_MS) {
          setProgress(100);
          window.dispatchEvent(new CustomEvent("orc:splashComplete"));
          document.body.classList.add("splash-exit");
          return;
        }

        rafId = requestAnimationFrame(tick);
      }

      setTimeout(() => {
        startedAt = performance.now();
        setProgress(1);
        rafId = requestAnimationFrame(tick);
      }, START_DELAY_MS);
    </script>
  </body>
</html>

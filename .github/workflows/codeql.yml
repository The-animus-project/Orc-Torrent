# Advanced CodeQL setup.
# Default setup uses build-mode:none for Java/Kotlin, which skips Kotlin extraction and
# leaves call/type resolution below quality thresholds (e.g. 71%/76% vs 85%).
# This workflow traces a real Android Gradle compile so the extractor sees Kotlin
# sources and dependencies.
#
# Required once after merging:
#   Settings → Code security → Code scanning → CodeQL → Disable "Default setup"
# Advanced uploads are rejected while Default setup remains enabled.

name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '27 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: java-kotlin
            build-mode: manual

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Setup Node.js
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            ui/desktop/package-lock.json
            ui/android/package-lock.json

      - name: Install Android SDK packages
        if: matrix.language == 'java-kotlin'
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Sync Capacitor Android project
        if: matrix.language == 'java-kotlin'
        run: |
          npm ci --prefix ui/desktop
          npm ci --prefix ui/android
          npm run sync:web --prefix ui/android
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > ui/android/android/local.properties

      - name: Initialize CodeQL
        uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: .github/codeql/codeql-config.yml

      - name: Build Android sources for Java/Kotlin extraction
        if: matrix.build-mode == 'manual'
        env:
          # Skip the Rust NDK step; CodeQL only needs the JVM/Kotlin compile traced.
          ORC_SKIP_RUST_ANDROID: '1'
        working-directory: ui/android/android
        run: |
          ./gradlew --no-daemon --no-build-cache --rerun-tasks \
            :app:compileDebugKotlin \
            :app:compileDebugJavaWithJavac \
            :app:compileDebugUnitTestKotlin \
            :app:compileDebugUnitTestJavaWithJavac

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          category: "/language:${{ matrix.language }}"

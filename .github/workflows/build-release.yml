# Production build: installers for macOS, Linux, and Windows; upload artifacts and attach to GitHub Releases on tags.
# - Run manually: Actions → Build release → Run workflow
# - Or push a tag v* (e.g. v2.2.1) to create a GitHub Release with assets

name: Build release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Unsigned builds by default. For signed Windows installers: set secrets CSC_LINK + CSC_KEY_PASSWORD,
  # set this to 'true' when the runner can resolve the cert, and enable signing in ui/desktop/package.json win.*.
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  # macos-latest is Apple Silicon (arm64). Intel artifacts use GitHub's dedicated x64 runner.
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install dependencies
        run: npm ci
        working-directory: ui/desktop

      - name: Build and package
        run: npm run dist
        working-directory: ui/desktop

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ORC-TORRENT-macos
          path: |
            ui/desktop/release/*.dmg
            ui/desktop/release/*.zip
            ui/desktop/release/*.pkg
            ui/desktop/release/latest*.yml
            ui/desktop/release/*.blockmap
          if-no-files-found: error

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          files: |
            ui/desktop/release/*.dmg
            ui/desktop/release/*.zip
            ui/desktop/release/*.pkg
            ui/desktop/release/latest*.yml
            ui/desktop/release/*.blockmap
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-intel:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install dependencies
        run: npm ci
        working-directory: ui/desktop

      - name: Build and package
        run: npm run dist
        working-directory: ui/desktop

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ORC-TORRENT-macos-x64
          path: |
            ui/desktop/release/*.dmg
            ui/desktop/release/*.zip
            ui/desktop/release/*.pkg
            ui/desktop/release/latest*.yml
            ui/desktop/release/*.blockmap
          if-no-files-found: error

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          files: |
            ui/desktop/release/*.dmg
            ui/desktop/release/*.zip
            ui/desktop/release/*.pkg
            ui/desktop/release/*.blockmap
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfuse2 \
            fakeroot \
            rpm \
            squashfs-tools \
            libarchive-tools \
            desktop-file-utils \
            xvfb

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install dependencies
        run: npm ci
        working-directory: ui/desktop

      - name: Build and package
        run: xvfb-run --auto-servernum npm run dist
        working-directory: ui/desktop

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ORC-TORRENT-linux
          path: |
            ui/desktop/release/*.AppImage
            ui/desktop/release/*.deb
            ui/desktop/release/latest*.yml
            ui/desktop/release/*.blockmap
          if-no-files-found: error

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          files: |
            ui/desktop/release/*.AppImage
            ui/desktop/release/*.deb
            ui/desktop/release/latest*.yml
            ui/desktop/release/*.blockmap
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install dependencies
        run: npm ci
        working-directory: ui/desktop

      - name: npm audit
        run: npm audit --audit-level=high
        working-directory: ui/desktop
        continue-on-error: true

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: cargo audit
        run: cargo audit
        working-directory: crates
        continue-on-error: true

      - name: Build and package
        run: npm run dist
        working-directory: ui/desktop

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ORC-TORRENT-windows
          path: |
            ui/desktop/release/*.exe
            ui/desktop/release/*.zip
            ui/desktop/release/latest*.yml
            ui/desktop/release/*.blockmap
          if-no-files-found: error

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          files: |
            ui/desktop/release/*.exe
            ui/desktop/release/*.zip
            ui/desktop/release/latest*.yml
            ui/desktop/release/*.blockmap
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
